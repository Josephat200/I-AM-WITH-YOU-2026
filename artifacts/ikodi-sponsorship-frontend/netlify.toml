# Only the sponsorship frontend is deployed to this site, so build just that
# workspace package instead of the whole monorepo. Paths are relative to the
# repository root, where the build command runs.
[build]
  command = "pnpm --filter @workspace/ikodi-sponsorship-frontend run build"
  publish = "artifacts/ikodi-sponsorship-frontend/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PORT = "3000"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
